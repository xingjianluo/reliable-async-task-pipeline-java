# 异步任务流水线配置（前缀 task.pipeline）
# 并发工作线程数
task.pipeline.worker-threads=2
# 就绪队列容量（积压达到该阈值的新提交会被拒绝：REJECTED / QUEUE_FULL）
task.pipeline.queue-capacity=100
# 最大尝试次数（含首次），超过后可重试失败进入死信
task.pipeline.max-attempts=3
# 指数退避基数与上限（毫秒）
task.pipeline.backoff-base-millis=100
task.pipeline.backoff-max-millis=2000
# 优雅停机等待上限（毫秒），超时未完成的在途任务安全转为 PENDING 持久化
task.pipeline.shutdown-wait-millis=5000
# 本地 JSON 快照存储目录（不依赖外部服务）
task.pipeline.store-dir=target/task-pipeline-store

# 单测/本地运行时打印幂等键、尝试次数、状态流转与失败分类依据
logging.level.com.github.xingjianluo.reliableasynctaskpipelinejava.pipeline=INFO
