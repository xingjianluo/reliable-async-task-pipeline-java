spring.application.name=reliable-async-task-pipeline-java

# 并发执行上限
pipeline.concurrency=4
# 队列积压阈值，超过则拒绝提交（背压）
pipeline.max-backlog=100
# 默认最大尝试次数（含首次执行）
pipeline.default-max-attempts=3
# 重试退避基数（毫秒），按 attempt 指数增长并封顶 30s
pipeline.backoff-base-millis=200
# 优雅停机等待在途任务完成的限定时间（毫秒）
pipeline.shutdown-timeout-millis=5000
